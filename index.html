<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; overflow: hidden; background: transparent; font-family: sans-serif; }
  .ticker-wrap {
    width: 100%;
    overflow: hidden;
    background-color: #1a73e8; /* Warna latar belakang */
    color: white;              /* Warna teks */
    padding: 8px 0;
  }
  .ticker {
    display: inline-block;
    white-space: nowrap;
    padding-left: 100%;
    animation: marquee 18s linear infinite; /* Atur kecepatan (18s) di sini */
    font-size: 14px;
    font-weight: bold;
  }
  @keyframes marquee {
    0%   { transform: translate(0, 0); }
    100% { transform: translate(-100%, 0); }
  }
</style>
</head>
<body>
  <div class="ticker-wrap">
    <div class="ticker">
      Selamat Datang di Dashboard Laporan KBK — Pastikan data laporan diunggah sebelum tanggal 25 setiap bulannya.
    </div>
  </div>
</body>
</html>
